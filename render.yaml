services:
  - type: web
    name: harvestlink-food-network
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    disk:
      name: harvestlink-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: 3.12.7
